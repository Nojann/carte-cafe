name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # rebuild quotidien : retire les événements passés (cafes.ts › getData)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Coordonnées de contact, hors du dépôt (src/lib/contact.ts, docs/configuration-github.md)
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6 # npm ci + astro build, puis upload de dist/
        with:
          node-version: 24 # Astro 7 exige Node >= 22.23

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
